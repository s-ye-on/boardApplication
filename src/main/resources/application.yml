spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  h2:
    console:
      enabled: true


app:
  jwt:
    secret: very-secret-jwt-key-change-me-please-very-long
    expiration-seconds: 3600 # 1시간