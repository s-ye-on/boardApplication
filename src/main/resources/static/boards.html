<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>게시판 목록</title>
</head>
<body>
<h1>게시판 목록</h1>

<div id="user-info"></div>
<button id="logout-btn">로그아웃</button>

<hr>

<ul id="board-list"></ul>

<script>
    // 1. 토큰 확인
    const token = localStorage.getItem('accessToken');
    if (!token) {
        alert('로그인이 필요합니다.');
        window.location.href = '/login';
    }

    // 2. 사용자 정보 표시 (간단히 텍스트만)
    document.getElementById('user-info').textContent = '로그인 완료 (토큰 보유)';

    // 3. 게시판 목록 불러오기
    async function loadBoards(page = 0) {
        try {
            const res = await fetch(`/boards?page=${page}&size=10`, {
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            });

            if (!res.ok) {
                if (res.status === 401 || res.status === 403) {
                    alert('인증이 만료되었거나 권한이 없습니다. 다시 로그인 해주세요.');
                    localStorage.removeItem('accessToken');
                    window.location.href = '/login';
                    return;
                }
                const text = await res.text();
                alert('게시판 목록 조회 실패: ' + text);
                return;
            }

            const data = await res.json();
            const ul = document.getElementById('board-list');
            ul.innerHTML = '';

            // ✅ 서버 응답의 content 배열 사용
            data.content.forEach(board => {
                const li = document.createElement('li');
                li.textContent = `${board.name} - ${board.description} (${board.type})`;
                ul.appendChild(li);
            });

        } catch (e) {
            console.error(e);
            alert('게시판 목록을 불러오지 못했습니다.');
        }
    }

    // 4. 로그아웃 버튼
    document.getElementById('logout-btn').addEventListener('click', () => {
        localStorage.removeItem('accessToken');
        window.location.href = '/login';
    });

    // 초기 로드
    loadBoards();
</script>

</body>
</html>
